e mock_node.py", "status": "pass"}], "md": "### 3.1 Write the mock node\n\n```\nimport http.server, json, socketserver, time\nRES = {\"eth_chainId\": \"0x1\", \"eth_getBalance\": \"0x1234\", \"eth_blockNumber\": \"0x10\"}\nclass H(http.server.BaseHTTPRequestHandler):\n    def do_POST(self):\n        n = int(self.headers.get('content-length', 0))\n        req = json.loads(self.rfile.read(n) or b'{}')\n        body = json.dumps({\"jsonrpc\": \"2.0\", \"id\": req.get(\"id\", 1),\n                           \"result\": RES.get(req.get(\"method\"), \"0x0\")}).encode()\n        self.send_response(200)\n        self.send_header('content-length', str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *a): pass\n# Threaded because eth_rpc_module is concurrency: \"multi\" and opens a fresh\n# connection per call, so the single-threaded server would serialise them.\nclass Node(http.server.ThreadingHTTPServer):\n    # HTTPServer.server_bind() looks the host up in reverse DNS BETWEEN bind() and\n    # listen(), and nothing here needs the FQDN. Until that lookup answers the port\n    # is bound but not yet listening, so a caller's connect never completes; on a CI\n    # box whose resolver drops reverse queries for 127.0.0.1 that ran past 30s and\n    # read as an unreachable node.\n    def server_bind(self):\n        socketserver.TCPServer.server_bind(self)\n        self.server_name, self.server_port = self.server_address[:2]\nt0 = time.time()\nsrv = Node(('127.0.0.1', 8599), H)\nhost, port = srv.server_address[:2]\nprint('listening on %s:%d after %.1fs' % (host, port, time.time() - t0), flush=True)\nsrv.serve_forever()\n```"}, {"execs": [{"cmd": "sh -c 'python3 mock_node.py > mock.log 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.2 Start the mock node\n\n```bash\npython3 mock_node.py &\n```"}, {"execs": [{"cmd": "write wait_for_node.py", "kind": "file", "note": "Wrote wait_for_node.py", "status": "pass"}], "md": "### 3.3 Write the readiness check\n\n```\nimport json, socket, sys, time, urllib.request\ndeadline = time.time() + 30\nwhile time.time() < deadline:\n    try:\n        socket.create_connection((\"127.0.0.1\", 8599), timeout=1).close()\n        break\n    except OSError:\n        time.sleep(0.2)\nelse:\n    try: log = open(\"mock.log\").read().strip() or \"(empty)\"\n    except OSError: log = \"(no mock.log)\"\n    sys.exit(\"nothing accepted on 127.0.0.1:8599 after 30s; mock.log: \" + log)\nreq = urllib.request.Request(\n    \"http://127.0.0.1:8599\",\n    data=json.dumps({\"jsonrpc\": \"2.0\", \"id\": 1,\n                     \"method\": \"eth_chainId\", \"params\": []}).encode(),\n    headers={\"content-type\": \"application/json\"})\nprint(\"mock node answered:\", urllib.request.urlopen(req, timeout=5).read().decode())\n```"}, {"execs": [{"cmd": "python3 wait_for_node.py", "exit_code": 0, "kind": "run", "note": "", "output": "mock node answered: {\"jsonrpc\": \"2.0\", \"id\": 1, \"result\": \"0x1\"}\n", "status": "pass"}], "md": "### 3.4 Wait until the node answers\n\n`python3 mock_node.py &` returns once the shell has forked, not once the listener is\nup, so this waits for a connection rather than guessing at a sleep. Answering\n`eth_chainId` here also separates the fixture from the module: if this passes and the\nround-trip below fails, the node was reachable and the module's transport is what did\nnot reach it.\n\n```bash\npython3 wait_for_node.py\n```"}, {"execs": [], "md": "## Step 4: Run the daemon and drive the client"}, {"execs": [{"cmd": "write chain_ok.json", "kind": "file", "note": "Wrote chain_ok.json", "status": "pass"}], "md": "### 4.1 Write the chain configs\n\nTwo chains: chain 1 points at the mock node with no proxy required;\nchain 9 **requires** a proxy but is given none \u2014 so it must fail closed.\n\n```json\n{ \"endpoint\": \"http://127.0.0.1:8599\", \"proxyRequired\": false }\n```"}, {"execs": [{"cmd": "write chain_fc.json", "kind": "file", "note": "Wrote chain_fc.json", "status": "pass"}], "md": "### 4.2 Write the fail-closed chain config\n\n```json\n{ \"endpoint\": \"http://127.0.0.1:8599\", \"proxyRequired\": true }\n```"}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 4.3 Start the daemon\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```"}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module eth_rpc_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"eth_rpc_module\",\"optional_skipped\":[{\"module\":\"verified_proxy_module\",\"named_by\":\"eth_rpc_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 4.4 Load the module\n\n```bash\n./logos/bin/logoscore load-module eth_rpc_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call eth_rpc_module set_chain_config 1 @chain_ok.json", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"set_chain_config\",\"module\":\"eth_rpc_module\",\"result\":true,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.5 Configure chain 1 (mock node, no proxy)\n\n```bash\nlogoscore call eth_rpc_module set_chain_config 1 @chain_ok.json\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call eth_rpc_module list_chains", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"list_chains\",\"module\":\"eth_rpc_module\",\"result\":\"{\\\"chains\\\":[1],\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.6 List configured chains\n\n```bash\n./logos/bin/logoscore call eth_rpc_module list_chains\n```"}, {"execs": [{"cmd": "for i in 1 2 3 4 5 6; do\n  out=$(./logos/bin/logoscore call eth_rpc_module verify_chain_id 1 2>&1)\n  case \"$out\" in *RPC_FAILED*) sleep 3 ;; *) break ;; esac\ndone\nprintf '%s\\n' \"$out\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"verify_chain_id\",\"module\":\"eth_rpc_module\",\"result\":\"{\\\"chainId\\\":1,\\\"ok\\\":true,\\\"route\\\":\\\"direct\\\"}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.7 Verify the chain ID (real RPC round-trip)\n\n`verify_chain_id` issues a live `eth_chainId` to the mock node.\n\n```bash\nlogoscore call eth_rpc_module verify_chain_id 1\n```"}, {"execs": [{"cmd": "for i in 1 2 3 4 5 6; do\n  out=$(./logos/bin/logoscore call eth_rpc_module get_balance 1 f39fd6e51aad88f6f4ce6ab8827279cfffb92266 2>&1)\n  case \"$out\" in *RPC_FAILED*) sleep 3 ;; *) break ;; esac\ndone\nprintf '%s\\n' \"$out\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"get_balance\",\"module\":\"eth_rpc_module\",\"result\":\"{\\\"ok\\\":true,\\\"result\\\":\\\"0x1234\\\",\\\"route\\\":\\\"direct\\\"}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.8 Read a balance (round-trip)\n\n```bash\nlogoscore call eth_rpc_module get_balance 1 <address>\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call eth_rpc_module set_chain_config 9 @chain_fc.json", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"set_chain_config\",\"module\":\"eth_rpc_module\",\"result\":true,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.9 Configure chain 9 (proxy REQUIRED, none available)\n\n```bash\n./logos/bin/logoscore call eth_rpc_module set_chain_config 9 @chain_fc.json\n```"}, {"execs": [{"cmd": "for i in 1 2 3 4 5 6; do\n  out=$(./logos/bin/logoscore call eth_rpc_module get_balance 9 f39fd6e51aad88f6f4ce6ab8827279cfffb92266 2>&1)\n  case \"$out\" in *RPC_FAILED*) sleep 3 ;; *) break ;; esac\ndone\nprintf '%s\\n' \"$out\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"get_balance\",\"module\":\"eth_rpc_module\",\"result\":\"{\\\"error\\\":\\\"proxy: proxy required but none configured (fail-closed: refusing to send in the clear)\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.10 Fail-closed: the request is refused\n\nChain 9 requires a proxy but none is configured, so the module refuses\nto send the request in the clear \u2014 the wallet's privacy guarantee.\n\n```bash\nlogoscore call eth_rpc_module get_balance 9 <address>\n```"}, {"execs": [{"cmd": "trap '' TERM\n./logos/bin/logoscore stop || true\npkill -f mock_node.py 2>/dev/null || true\ntrue\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.11 Stop the daemon and the mock node\n\n```bash\ntrap '' TERM\n./logos/bin/logoscore stop || true\npkill -f mock_node.py 2>/dev/null || true\ntrue\n\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /var/folders/36/tjdph2t965j8snz9_vkdnw0r0000gn/T/logos_core_service_dcafa9e4bd08). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 4.12 Confirm the daemon has stopped\n\n```bash\n./logos/bin/logoscore status || true\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
